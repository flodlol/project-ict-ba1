<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Dankje</title>
	<link rel="icon" type="image/svg+xml" href="../../public/favicon/favicon.svg">
	<link rel="icon" type="image/png" sizes="96x96" href="../../public/favicon/favicon-96x96.png">
	<link rel="shortcut icon" href="../../public/favicon/favicon.ico">
    <link rel="stylesheet" href="../styles/stijl.css" type="text/css" />
    <link rel="stylesheet" href="../styles/formulier.css" type="text/css" />
  </head>
  <body>
    <div class="page-header">
    <h1>Website project ICT</h1>
    <p id="sub-title">Egon Huyge en Jonas Meuleman</p>
    </div>

    <h1>Dankje</h1>
    <p>Dit zijn je antwoorden:</p>
    <p id="antwoord-lijst"></p>
    <p><a href="formulier.htm">Terug naar het formulier</a></p>

    <script>
      function getLabel(key) {
        var labels = {
          voornaam: 'Voornaam',
          achternaam: 'Achternaam',
          inkomen: 'Maandelijks inkomen',
          bezoeker: 'Favoriete Epstein-Eiland Bezoeker',
          confort: 'Comfortabiliteiten',
          grootte: 'Aantal Deuren',
          bedkamers: 'Bedkamers'
        };

        return labels[key] || key;
      }

      function prettifyValue(key, value) {
        if (key === 'inkomen') {
          var incomeLabels = {
            low: '0€ - 10.000€',
            mid: '10.000€ - 25.000€',
            high: '25.000€ - 5.000€',
            boss: '500.000€+'
          };

          return incomeLabels[value] || value;
        }

        return value;
      }

      var params = new URLSearchParams(window.location.search);
      var list = document.getElementById('antwoord-lijst');
      var fields = ['voornaam', 'achternaam', 'inkomen', 'bezoeker', 'confort', 'grootte', 'bedkamers'];
      var lines = [];

      fields.forEach(function (field) {
        var values = params.getAll(field);
        if (!values.length) {
          values = ['Niet ingevuld'];
        }

        var item = document.createElement('li');
        var displayValues = values.map(function (value) {
          return prettifyValue(field, value);
        });

        lines.push(getLabel(field) + ': ' + displayValues.join(', '));
      });

      list.innerHTML = lines.join('<br>');
    </script>
  </body>
</html>
